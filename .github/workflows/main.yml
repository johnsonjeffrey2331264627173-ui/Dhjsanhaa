name: Build Cosmic Client APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if uploaded as a zip)
        run: |
          if [ -f cosmic-client-android.zip ]; then
            unzip -o cosmic-client-android.zip -d .
          fi

      - name: Add missing gradle.properties
        run: |
          cat > cosmic-client-android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: cosmic-client-android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-client-debug-apk
          path: cosmic-client-android/app/build/outputs/apk/debug/app-debug.apk
